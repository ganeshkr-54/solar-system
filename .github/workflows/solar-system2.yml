name: Solar System Workflow 2
on:
    workflow_dispatch: 
    push:
        branches: 
            - main
            - 'feature/*'

env:
    MONGO_URI: ${{vars.MONGO_URI}}
    MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}

jobs:
    unit-testing:
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
            env:
              MONGO_URI:  'mongodb://localhost:27017/superData'
              MONGO_USERNAME: non-prod-user
              MONGO_PASSWORD: non-prod-password        
        strategy:
          matrix:
            nodejs_version: [18,20]
            os: [ubuntu-latest]
            exclude:
              - nodejs_version: 18
                os: macos-latest

        runs-on: ${{matrix.os}}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v5
            
            - name: Setup Nodejs Version - ${{matrix.nodejs_version}}
              uses: actions/setup-node@v6
              with:
                node-version: ${{matrix.nodejs_version}}
            
            - name: Cache NPM Dependencies
              uses: actions/cache@v4
              with: 
                path: node_modules
                key: ${{matrix.os}}-node-modules-${{hashFiles('package-lock.json')}}

            - name: Install Dependencies
              run: npm install

            - name: Unit Testing
              run: npm test
            
            - name: Archive Unit Test result
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: Mocha-Test-Result-${{matrix.os}}-node${{matrix.nodejs_version}}
                path: test-results.xml
    
    code-coverage:
          name: Code Coverage
          container: 
            image: node:18
          services:
            mongo-db:
              image: siddharth67/mongo-db:non-prod
              options: 
                --name mongo
              env:
                MONGO_URI:  'mongodb://mongo:27017/superData'
                MONGO_USERNAME: non-prod-user
                MONGO_PASSWORD: non-prod-password 
            
          runs-on: ubuntu-latest
          steps:
              - name: Checkout Repo
                uses: actions/checkout@v5
              
              # - name: Setup Nodejs Version - 18
              #   uses: actions/setup-node@v6
              #   with:
              #     node-version: 18
              
              - name: Cache NPM Dependencies
                uses: actions/cache@v4
                with: 
                  path: node_modules
                  key: ${{matrix.os}}-node-modules-${{hashFiles('package-lock.json')}}  
                    
              - name: Install Dependencies
                run: npm install

              - name: Check Code Coverage
                continue-on-error: true
                run: npm run coverage
              
              - name: Archive code coverage Test result
                uses: actions/upload-artifact@v4
                with:
                  name: Code-Coverage-Result
                  path: coverage
                  retention-days: 5
    Docker:
      name: Building Docker Image
      runs-on: ubuntu-latest
      needs: [code-coverage,unit-testing]
      steps: 
        - name: Checkout Repo
          uses: actions/checkout@v5

        - name: Docker login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
        - name: Build and testing image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

        - name: Testing the image
          run: |
            docker images
            docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing Image URL using wget
            wget -qO-  127.0.0.1:3000/live | grep live

        - name: Pushing image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system-${{github.sha}}
            


